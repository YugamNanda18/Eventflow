<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title != null ? title + ' - EventFlow' : 'EventFlow - Reliable Event Processing'}">EventFlow</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        .sidebar { background-color: #1e293b; border-right: 1px solid #334155; min-height: 100vh; }
        .nav-link { color: #94a3b8; border-radius: 6px; padding: 10px 16px; margin-bottom: 4px; }
        .nav-link:hover, .nav-link.active { background-color: #3b82f6; color: #ffffff; }
        .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
        .badge-status { font-weight: 600; padding: 4px 8px; border-radius: 4px; }
        .bg-received { background-color: #0284c7; color: #fff; }
        .bg-success { background-color: #10b981; color: #fff; }
        .bg-failed { background-color: #ef4444; color: #fff; }
        .bg-retrying { background-color: #f59e0b; color: #fff; }
        .bg-unresolved { background-color: #dc2626; color: #fff; }
        .code-block { background-color: #090d16; border: 1px solid #334155; padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; color: #38bdf8; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <nav class="col-md-3 col-lg-2 sidebar d-flex flex-column p-3">
            <a href="/dashboard" class="d-flex align-items-center mb-4 text-white text-decoration-none">
                <i class="bi bi-diagram-3-fill text-primary fs-3 me-2"></i>
                <span class="fs-4 fw-bold">EventFlow</span>
            </a>
            <hr class="border-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item"><a href="/dashboard" class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                <li><a href="/events" class="nav-link" th:classappend="${activePage == 'events' ? 'active' : ''}"><i class="bi bi-lightning-charge me-2"></i> Event Explorer</a></li>
                <li><a href="/webhooks" class="nav-link" th:classappend="${activePage == 'webhooks' ? 'active' : ''}"><i class="bi bi-send-check me-2"></i> Webhooks</a></li>
                <li><a href="/dlq" class="nav-link" th:classappend="${activePage == 'dlq' ? 'active' : ''}"><i class="bi bi-exclamation-triangle-fill me-2"></i> Dead Letter Queue</a></li>
                <li><a href="/audit" class="nav-link" th:classappend="${activePage == 'audit' ? 'active' : ''}"><i class="bi bi-journal-text me-2"></i> Audit Logs</a></li>
                <li><a href="/api-keys" class="nav-link" th:classappend="${activePage == 'apiKeys' ? 'active' : ''}"><i class="bi bi-key-fill me-2"></i> API Keys</a></li>
                <li><a href="/simulator" class="nav-link" th:classappend="${activePage == 'simulator' ? 'active' : ''}"><i class="bi bi-bug-fill me-2"></i> Failure Simulator</a></li>
            </ul>
            <hr class="border-secondary">
            <div class="small text-muted text-center">
                <span>DemoCorp &bull; Tenant Isolation</span>
                <div class="mt-1"><span class="badge bg-primary">Java 21 &bull; Kafka &bull; Postgres</span></div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div th:replace="${content}"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
