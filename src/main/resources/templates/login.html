<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - EventFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .card-login { background-color: #1e293b; border: 1px solid #334155; width: 100%; max-width: 420px; border-radius: 12px; padding: 2rem; }
    </style>
</head>
<body>
<div class="card-login">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-primary">EventFlow Platform</h3>
        <p class="text-muted small">Reliable Event Ingestion &amp; Webhook Engine</p>
    </div>
    <form action="/api/v1/auth/login" method="POST" id="loginForm">
        <div class="mb-3">
            <label class="form-label text-muted">Email address</label>
            <input type="email" id="email" class="form-control bg-dark text-light border-secondary" value="admin@demo.eventflow" required>
        </div>
        <div class="mb-3">
            <label class="form-label text-muted">Password</label>
            <input type="password" id="password" class="form-control bg-dark text-light border-secondary" value="Password123!" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
    </form>
    <div class="mt-4 p-3 bg-dark border border-secondary rounded small">
        <strong>Demo Credentials:</strong><br>
        <code>admin@demo.eventflow</code> / <code>Password123!</code><br>
        <code>developer@demo.eventflow</code> / <code>Password123!</code><br>
        <code>operator@demo.eventflow</code> / <code>Password123!</code>
    </div>
</div>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        if (res.ok) {
            const data = await res.json();
            localStorage.setItem('accessToken', data.accessToken);
            window.location.href = '/dashboard';
        } else {
            alert('Login failed. Please check credentials.');
        }
    });
</script>
</body>
</html>
