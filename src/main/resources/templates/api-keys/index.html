<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>API Keys - EventFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', system-ui, sans-serif; }
        .sidebar { background-color: #1e293b; border-right: 1px solid #334155; min-height: 100vh; }
        .nav-link { color: #94a3b8; border-radius: 6px; padding: 10px 16px; margin-bottom: 4px; }
        .nav-link:hover, .nav-link.active { background-color: #3b82f6; color: #ffffff; }
        .card-custom { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Navigation -->
        <nav class="col-md-3 col-lg-2 sidebar d-flex flex-column p-3">
            <a href="/dashboard" class="d-flex align-items-center mb-4 text-white text-decoration-none">
                <i class="bi bi-diagram-3-fill text-primary fs-3 me-2"></i>
                <span class="fs-4 fw-bold">EventFlow</span>
            </a>
            <hr class="border-secondary">
            <ul class="nav nav-pills flex-column mb-auto">
                <li><a href="/dashboard" class="nav-link"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                <li><a href="/events" class="nav-link"><i class="bi bi-lightning-charge me-2"></i> Event Explorer</a></li>
                <li><a href="/webhooks" class="nav-link"><i class="bi bi-send-check me-2"></i> Webhooks</a></li>
                <li><a href="/dlq" class="nav-link"><i class="bi bi-exclamation-triangle-fill me-2"></i> Dead Letter Queue</a></li>
                <li><a href="/audit" class="nav-link"><i class="bi bi-journal-text me-2"></i> Audit Logs</a></li>
                <li class="nav-item"><a href="/api-keys" class="nav-link active"><i class="bi bi-key-fill me-2"></i> API Keys</a></li>
                <li><a href="/simulator" class="nav-link"><i class="bi bi-bug-fill me-2"></i> Failure Simulator</a></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="h3 fw-bold">API Keys Management</h2>
                <button class="btn btn-primary btn-sm" onclick="createApiKey()"><i class="bi bi-key me-1"></i> Generate New Key</button>
            </div>

            <div class="card-custom p-4">
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                            <tr class="text-muted">
                                <th>Key ID</th>
                                <th>Name</th>
                                <th>Prefix</th>
                                <th>Scopes</th>
                                <th>Status</th>
                                <th>Created At</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="key : ${apiKeys}">
                                <td><code th:text="${key.id}">key_123</code></td>
                                <td th:text="${key.name}">Demo Ingestion Key</td>
                                <td><code class="text-warning" th:text="${key.keyPrefix} + '...' ">ef_live_demo...</code></td>
                                <td><small class="text-info" th:text="${key.scopes}">events:write</small></td>
                                <td><span class="badge bg-success" th:if="${!key.revoked}">ACTIVE</span><span class="badge bg-danger" th:if="${key.revoked}">REVOKED</span></td>
                                <td th:text="${key.createdAt}">2026-09-16</td>
                                <td>
                                    <button class="btn btn-sm btn-outline-danger" th:if="${!key.revoked}" th:onclick="'revokeKey(\'' + ${key.id} + '\')'">Revoke</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<script>
    async function createApiKey() {
        const name = prompt("Enter API Key Name:", "Production Key");
        if (!name) return;
        const res = await fetch('/api/v1/api-keys', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ef_live_demo1234567890abcdef123456'
            },
            body: JSON.stringify({ name, scopes: "events:write,events:read,webhooks:manage" })
        });
        if (res.ok) {
            const data = await res.json();
            alert("API Key Created Successfully!\n\nRAW KEY (SAVE NOW, IT WILL NOT BE SHOWN AGAIN):\n" + data.rawApiKey);
            window.location.reload();
        } else {
            alert("Error creating API key.");
        }
    }
    async function revokeKey(id) {
        if (!confirm("Revoke API key " + id + "?")) return;
        const res = await fetch('/api/v1/api-keys/' + id, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ef_live_demo1234567890abcdef123456' }
        });
        if (res.ok) window.location.reload();
    }
</script>
</body>
</html>
